version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: packiq
      POSTGRES_PASSWORD: packiq_secure_password
      POSTGRES_DB: packiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://packiq:packiq_secure_password@postgres:5432/packiq_db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "packiq-secret-key-dev"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

volumes:
  postgres_data:
